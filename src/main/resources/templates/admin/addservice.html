<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Form</title>

<style>

    body{
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #4facfe, #00f2fe);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    form{
        width: 420px;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0px 8px 25px rgba(0,0,0,0.2);
    }

    h2{
        text-align: center;
        margin-bottom: 25px;
        color: #333;
        font-size: 28px;
    }

    label{
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #444;
    }

    input,
    textarea{
        width: 100%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 15px;
        transition: 0.3s;
        box-sizing: border-box;
    }

    input:focus,
    textarea:focus{
        border-color: #4facfe;
        outline: none;
        box-shadow: 0px 0px 8px rgba(79,172,254,0.5);
    }

    textarea{
        resize: none;
    }

    input[type="file"]{
        padding: 10px;
        background-color: #f9f9f9;
    }

    input[type="submit"]{
        background: linear-gradient(to right, #4facfe, #00c6fb);
        color: white;
        border: none;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }

    input[type="submit"]:hover{
        transform: scale(1.03);
        background: linear-gradient(to right, #00c6fb, #4facfe);
    }

</style>

</head>
<body>


<form action="addService" method="post" enctype="multipart/form-data">

    <h2>Service Form</h2>
       
       
    <label>Service Image</label>
    <input type="file" id="image" name="image">

    <label>Title</label>
    <input type="text" id="title" name="title" placeholder="Enter service title">

    <label>Description</label>
    <textarea rows="5" id="description" name="description" placeholder="Enter service description"></textarea>

    <input type="submit" value="Submit">
    
    <h3 style="text-align: center; color: red" th:text="${msg}"></h3>
    
    <a style="text-align: center; color: green;" href="dashboard">Go To Admin Page</a><br>
    

         

</form>

</body>
</html>
