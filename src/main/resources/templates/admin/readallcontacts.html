<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
<meta charset="UTF-8">
<title>Read All Contacts</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f4f7fc;
        padding:40px;
    }

    h1{
        text-align:center;
        color:#243b55;
        margin-bottom:20px;
        font-size:34px;
    }

    h2{
        text-align:center;
        color:green;
        margin-bottom:20px;
    }

    .home-link{
        display:inline-block;
        text-decoration:none;
        color:white;
        background:#243b55;
        padding:10px 18px;
        border-radius:6px;
        margin-bottom:20px;
        font-weight:bold;
        transition:0.3s;
    }

    .home-link:hover{
        background:#141e30;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:25px;
        background:white;
        box-shadow:0px 5px 15px rgba(0,0,0,0.1);
        border-radius:10px;
        overflow:hidden;
    }

    thead{
        background:#243b55;
        color:white;
    }

    th{
        padding:15px;
        text-align:center;
        font-size:16px;
    }

    td{
        padding:14px;
        text-align:center;
        border-bottom:1px solid #ddd;
    }

    tbody tr:hover{
        background:#f1f5ff;
    }

    .delete-btn{
        text-decoration:none;
        background:#e53935;
        color:white;
        padding:8px 14px;
        border-radius:5px;
        font-size:14px;
        transition:0.3s;
    }

    .delete-btn:hover{
        background:#c62828;
    }

</style>

</head>
<body>

    <h1>READALL CONTACTS SECTION</h1>
    
    <a class="home-link" href="dashboard">Go To ADMIN HOME</a><br><br>
         
    <h2 th:text="${message}"></h2>
         
    <table border="1">

        <thead>
            <tr>
                <th>ID</th>
                <th>NAME</th>
                <th>EMAIL</th>
                <th>MESSAGE</th>
                <th>PHONE</th>
                <th>ACTION</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each=" contact  :  ${allContacts}">

                <td style="padding: 10px" th:text="${contact.id}"></td>

                <td th:text="${contact.name}"></td>

                <td th:text="${contact.email}"></td>

                <td th:text="${contact.message}"></td>

                <td th:text="${contact.phone}"></td>

                <td>
                    <a class="delete-btn"
                       th:href="@{/admin/deleteContact/{id}(id=${contact.id})}">
                       DELETE
                    </a>
                </td>

            </tr>

        </tbody>
             
    </table>

</body>
</html>
