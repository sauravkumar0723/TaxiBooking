<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"	>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Details Table</title>

<style>
    body{
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        padding: 30px;
    }

    .table-container{
        width: 95%;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h2{
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    table{
        width: 100%;
        border-collapse: collapse;
    }

    table thead{
        background-color: #007bff;
        color: white;
    }

    table th,
    table td{
        border: 1px solid #ddd;
        padding: 12px;
        text-align: center;
    }

    table tbody tr:nth-child(even){
        background-color: #f9f9f9;
    }

    table tbody tr:hover{
        background-color: #f1f1f1;
    }

    th{
        font-size: 16px;
    }

    td{
        font-size: 14px;
        color: #333;
    }

    .message{
        max-width: 250px;
        word-wrap: break-word;
    }
</style>
</head>

<body>

<div class="table-container">
    <h2>BOOKING DETAILS</h2>
   
   <a style="color:blue; display:block; text-align:center;" href="dashboard">ADMIN HOME</a>   
         <h2 th:text="${message}"></h2>

    <table>
        <thead>
            <tr>
                <th >Id</th>
                <th>Name</th>
                <th>Email</th>
                <th>Source</th>
                <th>Destination</th>
                <th>Date</th>
                <th>Time</th>
                <th>Comfort</th>
                <th>Adult</th>
                <th>Children</th>
                <th>Message</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>
            <tr  th:each=" booking   : ${allBookings}">
                <td th:text="${booking.id}"></td>
                <td th:text="${booking.name}"></td>
                <td th:text="${booking.email}"></td>
                <td th:text="${booking.source}"></td>
                <td th:text="${booking.destination}"></td>
                <td th:text="${booking.date}"></td>
                <td th:text="${booking.time}"></td>
                <td th:text="${booking.comfort}"></td>
                <td th:text="${booking.adult}"></td>
                <td th:text="${booking.children}"></td>
                <td class="message" th:text="${booking.message}">
                </td>
                <td> 
                     <a th:href="@{/admin/deleteBooking/{id}(id=${booking.id})}">DELETE</a> 
                
                </td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
