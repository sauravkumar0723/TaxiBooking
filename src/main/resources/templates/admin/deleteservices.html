<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Delete Services</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: Arial, sans-serif;
    }

    body{
        background:#f4f7fc;
        padding:30px;
    }

    h1{
        text-align:center;
        color:#243b55;
        margin-bottom:20px;
        font-size:32px;
    }

    .back-link{
        display:block;
        text-align:center;
        margin-bottom:25px;
        text-decoration:none;
        color:#fff;
        background:#243b55;
        width:200px;
        margin-left:auto;
        margin-right:auto;
        padding:10px;
        border-radius:8px;
        transition:0.3s;
    }

    .back-link:hover{
        background:#141e30;
        transform:scale(1.05);
    }

    .container{
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:20px;
    }

    .service-box{
        background:white;
        width:300px;
        border-radius:12px;
        box-shadow:0px 4px 15px rgba(0,0,0,0.1);
        padding:15px;
        transition:0.3s;
    }

    .service-box:hover{
        transform:translateY(-5px);
    }

    .service-box img{
        width:100%;
        height:180px;
        object-fit:cover;
        border-radius:10px;
        margin-bottom:10px;
    }

    h3{
        color:#243b55;
        margin-bottom:8px;
    }

    p{
        font-size:14px;
        color:#555;
        margin-bottom:15px;
        line-height:1.4;
    }

    .delete-btn{
        width:100%;
        padding:10px;
        background:#e74c3c;
        border:none;
        color:white;
        font-size:15px;
        border-radius:8px;
        cursor:pointer;
        transition:0.3s;
    }

    .delete-btn:hover{
        background:#c0392b;
        transform:scale(1.03);
    }

</style>

</head>
<body>

<h1>DELETE SERVICES (ADMIN ONLY)</h1>

<a class="back-link" href="dashboard">
    Go To Admin Page
</a>  

<div class="container">

    <div th:each="service : ${allservices}" class="service-box">

        <img th:src="@{'/myserviceimg/' + ${service.image}}">

        <h3 th:text="${service.title}"></h3>

        <p th:text="${service.description}"></p>

        <form th:action="@{/admin/deleteService/{id}(id=${service.id})}" 
              method="post"
              onsubmit="return confirm('Are you sure you want to delete this service?')">

            <button type="submit" class="delete-btn">
                DELETE
            </button>

        </form>

    </div>

</div>

</body>
</html>
