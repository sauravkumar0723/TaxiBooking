<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Change Credentials</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #eef2f7, #dde7f2);
    }

    form{
        background: rgba(255,255,255,0.95);
        padding:40px;
        width:380px;
        border-radius:18px;
        box-shadow:0 10px 25px rgba(0,0,0,0.08);
        border:1px solid #e6ecf5;
        backdrop-filter: blur(6px);
    }

    h2{
        text-align:center;
        margin-bottom:25px;
        color:#1f3c88;
        font-size:22px;
        font-weight:700;
    }

    label{
        display:block;
        margin-top:15px;
        margin-bottom:8px;
        font-weight:600;
        color:#2c3e50;
        font-size:14px;
    }

    input{
        width:100%;
        padding:12px;
        border:1px solid #d6deeb;
        border-radius:10px;
        outline:none;
        font-size:15px;
        background:#f9fbff;
        transition:0.3s;
    }

    input:focus{
        border-color:#1f3c88;
        background:#fff;
        box-shadow:0 0 6px rgba(31,60,136,0.2);
    }

    button{
        width:100%;
        padding:13px;
        margin-top:25px;
        border:none;
        border-radius:10px;
        background: linear-gradient(to right, #1f3c88, #2952cc);
        color:white;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 8px 18px rgba(31,60,136,0.25);
    }

    a{
        display:block;
        text-align:center;
        margin-top:18px;
        text-decoration:none;
        color:#1f3c88;
        font-weight:600;
        font-size:14px;
        transition:0.3s;
    }

    a:hover{
        color:#2952cc;
        text-decoration:underline;
    }

</style>

</head>
<body>

       <form action="changeCredentials" method="post">

           <h2>Change Credentials</h2>

           <label>Old Username</label>
           <input type="text" name="oldusername" placeholder="Enter OldUsername"><br>

           <label>Old Password</label>
           <input type="text" name="oldpassword" placeholder="Enter OldPassword"><br>

           <label>New Username</label>
           <input type="text" name="newusername" placeholder="Enter NewUsername"><br>

           <label>New Password</label>
           <input type="text" name="newpassword" placeholder="Enter NewPassword"><br>

           <button>Change</button>

           <a href="dashboard">Go To Admin Page</a>

       </form>

</body>
</html>
