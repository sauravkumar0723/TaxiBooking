<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Admin Dashboard</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background: linear-gradient(135deg, #f7f9fc, #e6eef7);
    }

    .admin-container{
        background:#ffffff;
        padding:45px 35px;
        width:420px;
        border-radius:18px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.08);
        border:1px solid #e6ecf5;
    }

    h1{
        color:#1f3c88;
        margin-bottom:15px;
        font-size:28px;
        font-weight:700;
        letter-spacing:1px;
    }

    h2{
        color:#2e7d32;
        margin-bottom:25px;
        font-size:16px;
        font-weight:600;
    }

    a{
        display:block;
        text-decoration:none;
        background:#f9fbff;
        color:#1f3c88;
        padding:13px;
        margin:12px 0;
        border-radius:12px;
        font-size:15px;
        font-weight:600;
        border:1px solid #d9e2ef;
        transition:0.25s ease;
        box-shadow:0 2px 6px rgba(0,0,0,0.04);
    }

    a:hover{
        background:#1f3c88;
        color:white;
        transform:translateY(-2px);
        box-shadow:0 8px 18px rgba(31,60,136,0.2);
    }

    a:last-child{
        color:#d32f2f;
        border:1px solid #f3c2c2;
        background:#fff5f5;
    }

    a:last-child:hover{
        background:#d32f2f;
        color:white;
    }

</style>

</head>
<body>

    <div class="admin-container">

       <h1>WELCOME TO ADMIN PANEL</h1>
       
       <h2 th:text="${message}"></h2>
      
       <a href="readAllContacts">READ ALL CONTACTS</a>
      
       <a href="readAllBookings">READ ALL BOOKINGS</a>
      
       <a href="addService">ADD SERVICE</a>
        
        <a href="deleteServices">DELETE SERVICES</a>
      
       <a href="changeCredentials">CHANGE CREDENTIALS</a>
      
       <a href="/dologout">LOGOUT</a>

    </div>
      
</body>
</html>
